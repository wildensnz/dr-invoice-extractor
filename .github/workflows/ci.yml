name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # typecheck + lint + format:check + unit tests. The eval is not run here:
      # it calls the Claude API and costs tokens.
      - run: npm run check
      - run: npm run build
